server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Chat images are uploaded as base64 JSON (~33% larger than the file).
  client_max_body_size 12m;

  # REST API -> backend container. Same origin as the page, so the
  # SameSite=Strict auth cookie just works and no CORS is involved.
  location /api/ {
    proxy_pass http://backend:5001;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # WebSocket upgrade for Socket.io. The long read timeout keeps idle
  # connections from being cut by nginx.
  location /socket.io/ {
    proxy_pass http://backend:5001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  # Hashed build assets can be cached forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback: any other path serves index.html (client-side routing).
  location / {
    try_files $uri /index.html;
  }
}
